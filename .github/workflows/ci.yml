name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR replaces its older run; every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # The toolchain checks itself with the same reusable workflow the other repos call.
  checks:
    uses: ./.github/workflows/node-checks.yml
