# Reusable: the checks every erakor JS/TS package runs. Call it from a repo's workflow:
#
#   jobs:
#     checks:
#       uses: erakor/toolchain/.github/workflows/node-checks.yml@v1
#       with:
#         working-directory: frontend   # where package.json is; default '.'
#
# Each script runs only if the package defines it (`pnpm run --if-present`), and each runs even
# when an earlier one failed, so one push reports all of them. Repo-specific steps (Storybook,
# Playwright, bundle freshness) stay in the repo's own jobs.
name: Node checks

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding package.json and the lockfile.
        type: string
        default: '.'
      node-version-file:
        description: Path to .nvmrc, from the repo root.
        type: string
        default: '.nvmrc'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run --if-present typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run --if-present lint

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run --if-present format:check

      - name: Unused files, exports and dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run --if-present knip

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run --if-present test
