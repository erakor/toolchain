# Reusable: the checks every erakor JS/TS package runs. Call it from a repo's workflow:
#
#   jobs:
#     checks:
#       uses: erakor/toolchain/.github/workflows/node-checks.yml@v1
#       with:
#         working-directory: frontend   # where package.json is; default '.'
#         build: true                       # also run the `build` script; default false
#
# Each script runs only if the package defines it (`pnpm run --if-present`), and each runs even
# when an earlier one failed, so one push reports all of them. Repo-specific steps (Storybook,
# Playwright, bundle freshness) stay in the repo's own jobs; Storybook has storybook-checks.yml.
name: Node checks

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding package.json and the lockfile.
        type: string
        default: '.'
      node-version-file:
        description: Path to .nvmrc, from the repo root.
        type: string
        default: '.nvmrc'
      build:
        description: Also run the package's `build` script, after the unit tests.
        type: boolean
        default: false
      # The two below exist for the consumer smoke test (smoke.yml); a repo calling this
      # workflow for its own checks leaves them out.
      repository:
        description: Check out this repo's default branch (owner/name) instead of the caller's.
        type: string
        default: ''
      toolchain-ref:
        description: Install @erakor/toolchain from this ref instead of the lockfile's.
        type: string
        default: ''

    secrets:
      token:
        description: Token that can read the `repository` above, if it is private.
        required: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository }}
          token: ${{ secrets.token || github.token }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        env:
          TOOLCHAIN_REF: ${{ inputs.toolchain-ref }}
        run: |
          if [ -z "$TOOLCHAIN_REF" ]; then
            pnpm install --frozen-lockfile
          else
            node -e "
              const fs = require('fs')
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
              let rewritten = 0
              for (const key of ['dependencies', 'devDependencies']) {
                if (pkg[key]?.['@erakor/toolchain']) {
                  pkg[key]['@erakor/toolchain'] = 'github:erakor/toolchain#' + process.env.TOOLCHAIN_REF
                  rewritten += 1
                }
              }
              if (rewritten === 0) {
                console.error('package.json does not list @erakor/toolchain: nothing to smoke-test')
                process.exit(1)
              }
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
            "
            pnpm install --no-frozen-lockfile
          fi

      - name: Type check
        run: pnpm run --if-present typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run --if-present lint

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run --if-present format:check

      - name: Unused files, exports and dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run --if-present knip

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run --if-present test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.build }}
        run: pnpm run build
