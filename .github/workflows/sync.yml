# Opens a pull request in each repo listed in .github/sync.yml when a synced file changes on main.
# Needs a SYNC_TOKEN secret: a fine-grained PAT limited to those repos, with Contents and
# Pull requests read/write. Without it the job is skipped.
name: Sync files

on:
  push:
    branches: [main]
    paths:
      - files/**
      - swift/**
      - .github/sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.SYNC_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_TOKEN }}
          CONFIG_PATH: .github/sync.yml
          COMMIT_PREFIX: 'chore(sync):'
          PR_LABELS: toolchain-sync
          SKIP_PR: false
